<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550">
<defs><linearGradient id="peach"><stop stop-color="#fcead9"/><stop offset="1" stop-color="#fffdfb"/></linearGradient><linearGradient id="blue"><stop stop-color="#cde8fa"/><stop offset="1" stop-color="#eaf5ff"/></linearGradient></defs>
<rect width="1040" height="550" fill="white"/>
<ellipse cx="35" cy="195" rx="10" ry="10" fill="#20313B" stroke="none" stroke-width="1.8"/>
<rect x="125.0" y="151.0" width="210" height="88" rx="12" fill="#F3F8F8" stroke="#53656F" stroke-width="1.8"/>
<rect x="125.0" y="154.0" width="5" height="82" rx="2" fill="#2D6E73" stroke="none" stroke-width="1.8"/>
<text x="230" y="187.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="28" font-weight="normal" fill="#20313B">已开具</text>
<text x="230" y="226.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="17" font-weight="normal" fill="#64747C">尚无有效净收款</text>
<rect x="455.0" y="151.0" width="210" height="88" rx="12" fill="#F3F8F8" stroke="#53656F" stroke-width="1.8"/>
<rect x="455.0" y="154.0" width="5" height="82" rx="2" fill="#2D6E73" stroke="none" stroke-width="1.8"/>
<text x="560" y="190.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="28" font-weight="normal" fill="#20313B">部分收款</text>
<text x="560" y="225.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="17" font-weight="normal" fill="#64747C">0 &lt; 净收款 &lt; 应收</text>
<rect x="785.0" y="151.0" width="210" height="88" rx="12" fill="#EDF7F1" stroke="#53656F" stroke-width="1.8"/>
<rect x="785.0" y="154.0" width="5" height="82" rx="2" fill="#2D6E73" stroke="none" stroke-width="1.8"/>
<text x="890" y="190.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="28" font-weight="normal" fill="#20313B">已结清</text>
<text x="890" y="225.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="17" font-weight="normal" fill="#64747C">净收款 = 应收</text>
<rect x="125.0" y="411.0" width="210" height="88" rx="12" fill="#FFF7E8" stroke="#53656F" stroke-width="1.8"/>
<rect x="125.0" y="414.0" width="5" height="82" rx="2" fill="#2D6E73" stroke="none" stroke-width="1.8"/>
<text x="230" y="449.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="28" font-weight="normal" fill="#20313B">已作废</text>
<text x="230" y="485.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="17" font-weight="normal" fill="#64747C">净收款 = 0 且已授权</text>
<polyline points="45,195 125,195" fill="none" stroke="#53656F" stroke-width="1.8"/>
<polygon points="114.2,189.6 125,195 114.2,200.4 114.2,189.6" fill="#53656F" stroke="#53656F" stroke-width="1.8"/>
<text x="68" y="151.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="18" font-weight="normal" fill="#20313B">T1</text>
<text x="68" y="175.5" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="18" font-weight="normal" fill="#20313B">生成结算单</text>
<polyline points="335,195 455,195" fill="none" stroke="#53656F" stroke-width="1.8"/>
<polygon points="444.2,189.6 455,195 444.2,200.4 444.2,189.6" fill="#53656F" stroke="#53656F" stroke-width="1.8"/>
<text x="395" y="177.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="18" font-weight="normal" fill="#20313B">T2 部分收款</text>
<polyline points="230,151 230,80 890,80 890,151" fill="none" stroke="#53656F" stroke-width="1.8"/>
<polygon points="895.4,140.2 890,151 884.6,140.2 895.4,140.2" fill="#53656F" stroke="#53656F" stroke-width="1.8"/>
<text x="560" y="58.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="18" font-weight="normal" fill="#20313B">T3 一次全额收款</text>
<polyline points="665,195 785,195" fill="none" stroke="#53656F" stroke-width="1.8"/>
<polygon points="774.2,189.6 785,195 774.2,200.4 774.2,189.6" fill="#53656F" stroke="#53656F" stroke-width="1.8"/>
<text x="725" y="177.0" text-anchor="middle" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="18" font-weight="normal" fill="#20313B">T4 结清尾款</text>
<polyline points="230,239 230,411" fill="none" stroke="#53656F" stroke-width="1.8"/>
<polygon points="235.4,400.2 230,411 224.6,400.2 235.4,400.2" fill="#53656F" stroke="#53656F" stroke-width="1.8"/>
<text x="252" y="330.0" text-anchor="start" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="18" font-weight="normal" fill="#20313B">T5 授权作废</text>
<text x="515" y="447.0" text-anchor="start" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="17" font-weight="normal" fill="#64747C">净收款按有效收款扣减退款计算。</text>
<text x="515" y="468.25" text-anchor="start" font-family="Microsoft YaHei,Noto Sans CJK SC,serif" font-size="17" font-weight="normal" fill="#64747C">退款后的状态转换见下一图。</text>
</svg>