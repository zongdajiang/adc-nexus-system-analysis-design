# Root entry point for the Deploy to Render button.
# Keep the service definition in sync with system/render.yaml.
services:
  - type: web
    name: adc-nexus-jdbc
    runtime: docker
    plan: free
    region: singapore
    rootDir: system
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: SEED_DATA
        value: "true"
      - key: APP_ENV
        value: PRODUCTION
      - key: TZ
        value: Asia/Shanghai
      - key: PORT
        value: "10000"
