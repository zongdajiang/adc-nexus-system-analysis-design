name: Java JDBC verification
on:
  push:
    paths: ["system/**", "render.yaml", ".github/workflows/system-verify.yml"]
  pull_request:
    paths: ["system/**", "render.yaml", ".github/workflows/system-verify.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adc_test
          POSTGRES_PASSWORD: local-ci-fixture-only
          POSTGRES_DB: adc_container_release
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adc_test -d adc_container_release"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate both free-plan Blueprints
        working-directory: system
        run: |
          python -m pip install --target .deps/qa-python PyYAML==6.0.2 jsonschema==4.25.1
          python tools/validate_deployment.py
      - name: Build the exact release Dockerfile
        run: docker build --tag adc-nexus:release-check --file system/Dockerfile system
      - name: Production container, memory limit and external database persistence
        working-directory: system
        env:
          ADC_CONTAINER_CHECK: "true"
          DATABASE_URL: "postgresql://adc_test:local-ci-fixture-only@127.0.0.1:5432/adc_container_release?sslmode=disable"
        run: python tools/verify_container.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: jdbc-release-container
          path: |
            system/qa/container-release-check.json
            system/qa/deployment-definition.json
          retention-days: 14
  acceptance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adc_test
          POSTGRES_PASSWORD: local-ci-fixture-only
          POSTGRES_DB: adc_acceptance_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adc_test -d adc_acceptance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: system
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: system/pom.xml
      - name: Compile and package
        run: |
          find src/main/resources/web -name '*.js' -print0 | xargs -0 -n 1 node --check
          mvn -B -ntp package
      - name: Business and identity acceptance in isolated databases
        env:
          ADC_ACCEPTANCE_JAR: "true"
          TEST_ENGINE: ${{ matrix.database }}
        run: |
          run_suite() {
            if [ "$TEST_ENGINE" = sqlite ]; then
              python "tools/$1.py"
              return
            fi
            local database="adc_acceptance_$1"
            PGPASSWORD=local-ci-fixture-only createdb -h 127.0.0.1 -p 5432 -U adc_test "$database"
            local url="postgresql://adc_test:local-ci-fixture-only@127.0.0.1:5432/$database?sslmode=disable"
            env "$2=$url" ADC_PSQL="$(command -v psql)" ADC_TEST_PSQL="$(command -v psql)" python "tools/$1.py"
            if [ "$1" = verify ]; then
              ADC_ACCEPTANCE_PG_URL="$url" ADC_TEST_PSQL="$(command -v psql)" python tools/verify_pg_backup.py
            fi
          }
          run_suite verify ADC_ACCEPTANCE_PG_URL
          run_suite verify_operating_workflow ADC_OPERATING_PG_URL
          run_suite verify_daily_workflow ADC_DAILY_PG_URL
          run_suite verify_demo_passwords ADC_LOGIN_PG_URL
          run_suite verify_responsibilities ADC_REVIEW_PG_URL
          run_suite verify_auth ADC_ACCEPTANCE_PG_URL
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: jdbc-acceptance-${{ matrix.database }}
          path: system/qa/*.json
          retention-days: 14
