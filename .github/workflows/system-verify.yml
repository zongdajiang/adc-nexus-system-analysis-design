name: Java JDBC verification
on:
  push:
    paths: ["system/**", "render.yaml", ".github/workflows/system-verify.yml"]
  pull_request:
    paths: ["system/**", "render.yaml", ".github/workflows/system-verify.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adc_test
          POSTGRES_PASSWORD: local-ci-fixture-only
          POSTGRES_DB: adc_container_release
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adc_test -d adc_container_release"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate both free-plan Blueprints
        working-directory: system
        run: |
          python -m pip install --target .deps/qa-python PyYAML==6.0.2 jsonschema==4.25.1
          python tools/validate_deployment.py
      - name: Build the exact release Dockerfile
        run: docker build --tag adc-nexus:release-check --file system/Dockerfile system
      - name: Production container, memory limit and external database persistence
        working-directory: system
        env:
          ADC_CONTAINER_CHECK: "true"
          DATABASE_URL: "postgresql://adc_test:local-ci-fixture-only@127.0.0.1:5432/adc_container_release?sslmode=disable"
        run: python tools/verify_container.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: jdbc-release-container
          path: |
            system/qa/container-release-check.json
            system/qa/deployment-definition.json
          retention-days: 14
  acceptance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adc_test
          POSTGRES_PASSWORD: local-ci-fixture-only
          POSTGRES_DB: adc_acceptance_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adc_test -d adc_acceptance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: system
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: system/pom.xml
      - name: Compile and package
        run: |
          node --check src/main/resources/web/app.js
          node --check src/main/resources/web/auth-ui.js
          node --check src/main/resources/web/homepage.js
          node --check src/main/resources/web/carousel.js
          node --check src/main/resources/web/clinic-calendar.js
          node --check src/main/resources/web/practice-workflow.js
          node --check src/main/resources/web/worklists.js
          node --check src/main/resources/web/practice-setup.js
          node --check src/main/resources/web/followups.js
          node tools/verify_web.mjs
          mvn -B -ntp package
          node tools/verify_clinic_ui.mjs
          node tools/verify_practice_ui.mjs
          node tools/verify_ui_refinement.mjs
          node tools/verify_setup_ui.mjs
      - name: Public surface contract in a separate local instance
        run: |
          export DATA_DIR="$(mktemp -d)"
          export PORT=8089 BIND_ADDRESS=127.0.0.1 DEMO_MODE=false APP_ENV=TEST
          java -jar target/adc-nexus.jar > /tmp/adc-homepage-check.log 2>&1 &
          public_pid=$!
          trap 'kill "$public_pid" 2>/dev/null || true; wait "$public_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8089/api/health > /dev/null; then break; fi
            sleep 1
          done
          ADC_PUBLIC_TEST_ORIGIN=http://127.0.0.1:8089 node tools/verify_homepage.mjs
      - name: Business acceptance in an isolated database
        env:
          ADC_ACCEPTANCE_JAR: "true"
        run: |
          if [ "${{ matrix.database }}" = "postgres" ]; then
            export ADC_ACCEPTANCE_PG_URL='postgresql://adc_test:local-ci-fixture-only@127.0.0.1:5432/adc_acceptance_ci?sslmode=disable'
            export ADC_TEST_PSQL="$(command -v psql)"
          fi
          python tools/verify.py
          if [ "${{ matrix.database }}" = "postgres" ]; then
            python tools/verify_pg_backup.py
          fi
      - name: Unified enrollment in a separate isolated database
        run: |
          if [ "${{ matrix.database }}" = "postgres" ]; then
            export PGPASSWORD='local-ci-fixture-only'
            createdb -h 127.0.0.1 -p 5432 -U adc_test adc_acceptance_auth_ci
            export ADC_PSQL="$(command -v psql)"
            export ADC_ACCEPTANCE_PG_URL='postgresql://adc_test:local-ci-fixture-only@127.0.0.1:5432/adc_acceptance_auth_ci?sslmode=disable'
          fi
          python tools/verify_auth.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: jdbc-acceptance-${{ matrix.database }}
          path: system/qa/*.json
          retention-days: 14
